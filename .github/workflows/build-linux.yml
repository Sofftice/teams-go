# .github/workflows/build-linux.yml
name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-webengine-dev \
            libqt6webenginewidgets6 \
            pkg-config \
            gcc g++

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 \
          CGO_CXXFLAGS="-std=c++17" \
          go build -ldflags '-s -w' -o dist/teams-go-linux-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: teams-go-linux-${{ matrix.arch }}
          path: dist/teams-go-linux-${{ matrix.arch }}
