name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # cache so qt isnt downloaded every run
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-qt6-${{ matrix.arch }}-${{ hashFiles('.github/workflows/build-linux.yml') }}
          restore-keys: apt-qt6-${{ matrix.arch }}-

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-webengine-dev \
            libqt6webenginewidgets6 \
            pkg-config \
            gcc g++

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 \
          CGO_CXXFLAGS="-std=c++17" \
          go build -ldflags '-s -w' -o dist/teams-go-linux-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: teams-go-linux-${{ matrix.arch }}
          path: dist/teams-go-linux-${{ matrix.arch }}